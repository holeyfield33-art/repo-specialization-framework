name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The suite is the check. tests/test_pipeline_regression.py already drives the
# runner end-to-end as a subprocess (artifacts, provenance labelling, dashboard
# banner, NOT_TRAINED marker, and real mode refusing to run without an adapter),
# so CI runs pytest rather than re-asserting the same things in shell.

jobs:
  core:
    name: core suite (no ML deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ingestion reads real git history to build change families
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest networkx pyyaml gitpython

      - name: Run the suite
        # ML-dependent tests self-skip via importorskip; -ra lists what skipped
        # so a silently shrinking suite is visible in the log.
        run: python -m pytest tests/ -v -ra

  ml:
    name: full suite (torch + peft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ml-${{ hashFiles('requirements.txt') }}

      - name: Install ML dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest networkx pyyaml gitpython transformers peft accelerate

      - name: Run the full suite
        # This job exists to run what core cannot: nothing here should skip.
        run: python -m pytest tests/ -v -ra

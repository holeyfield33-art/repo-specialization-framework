model_name_or_path: Qwen/Qwen2.5-Coder-1.5B-Instruct
load_in_4bit: true
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
bias: none
task_type: CAUSAL_LM
max_seq_length: 2048
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0002
num_train_epochs: 2.0
warmup_ratio: 0.03
logging_steps: 10
save_steps: 50
eval_steps: 50
save_total_limit: 2
lr_scheduler_type: cosine
optim: paged_adamw_8bit
max_grad_norm: 0.3
seed: 42
output_dir: results/adapters/qwen-repo-qlora
report_to: none
